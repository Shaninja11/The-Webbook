<!DOCTYPE html>
<main>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <script>
            function updateTime() {
                var currentTime = new Date().toLocaleString();
                var timeText = document.querySelector("#timeElement");
                timeText.innerHTML = currentTime;
        }
        setInterval(updateTime, 1000);
        </script>
        <div style="display: flex; border:  solid; color: rgb(255, 255, 255); border-radius: 0px; border-width: 1px,5px,1px,5px;">
            <select style="background-color: black; color: rgb(255, 255, 255); border-width: 0px;">  
                <option onclick="">open</option>
                <option> Close</option>
            </select>
            <p style="margin-left: 25%; font-size: 20px;">The WebBook</p>
            <p style="margin-top: 25px; margin-left: 15%; font-size: 10px;" id="timeElement">
            Time
            </p>
        </div>
    </body>

</main>
